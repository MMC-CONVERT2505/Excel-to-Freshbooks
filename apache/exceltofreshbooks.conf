# ── HTTP — Certbot will add HTTPS redirect automatically ─────────────────────
<VirtualHost *:80>
    ServerName exceltofreshbooks.mmcconvert.com

    # ── Backend API proxy (Docker container on port 1073) ────────────────────
    ProxyPreserveHost On

    ProxyPass        /auth         http://localhost:1073/auth
    ProxyPassReverse /auth         http://localhost:1073/auth

    ProxyPass        /freshbooks   http://localhost:1073/freshbooks
    ProxyPassReverse /freshbooks   http://localhost:1073/freshbooks

    ProxyPass        /migrate      http://localhost:1073/migrate
    ProxyPassReverse /migrate      http://localhost:1073/migrate

    ProxyPass        /parse        http://localhost:1073/parse
    ProxyPassReverse /parse        http://localhost:1073/parse

    ProxyPass        /excel        http://localhost:1073/excel
    ProxyPassReverse /excel        http://localhost:1073/excel

    ProxyPass        /callback     http://localhost:1073/callback
    ProxyPassReverse /callback     http://localhost:1073/callback

    ProxyPass        /health       http://localhost:1073/health
    ProxyPassReverse /health       http://localhost:1073/health

    ProxyPass        /config-check http://localhost:1073/config-check
    ProxyPassReverse /config-check http://localhost:1073/config-check

    # ── Frontend static files (React SPA) ────────────────────────────────────
    DocumentRoot /var/www/excel-to-freshbooks

    <Directory /var/www/excel-to-freshbooks>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
</VirtualHost>
